name: Release

# When the version in livepull.php changes on main:
#   1. Build livepull.zip (GitHub download, updates itself from GitHub releases) and
#      livepull-wordpress-org.zip (WordPress.org version), and publish a GitHub Release.
#   2. If WordPress.org SVN credentials are set (repository secrets SVN_USERNAME and
#      SVN_PASSWORD), also publish the new version to the WordPress.org plugin directory.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          VERSION=$(grep -m1 -E '^\s*\*\s*Version:' livepull.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          CONST=$(grep -m1 "const VERSION" includes/class-config.php | sed -E "s/.*'([^']+)'.*/\1/")
          STABLE=$(grep -m1 -i '^Stable tag:' readme.txt | sed -E 's/^[^:]+:\s*//' | tr -d '[:space:]')
          if [ "$VERSION" != "$CONST" ] || [ "$VERSION" != "$STABLE" ]; then
            echo "::error::Version mismatch: livepull.php $VERSION, class-config.php $CONST, readme.txt Stable tag $STABLE"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.exists.outputs.skip != 'true' || github.event_name == 'workflow_dispatch'
        run: bin/build.sh

      - name: Publish GitHub release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: this version's CHANGELOG section, else the commit message.
          awk -v v="## ${{ steps.v.outputs.version }}" 'index($0,v)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > changes.txt
          [ -s changes.txt ] || git log -1 --format=%B > changes.txt
          { cat .github/release-header.md; echo; cat changes.txt; } > notes.txt
          gh release create "v${{ steps.v.outputs.version }}" dist/*.zip dist/*.sha256 \
            --title "LivePull ${{ steps.v.outputs.version }}" \
            --notes-file notes.txt

      # Runs for new versions, and when started by hand (Actions → Release → Run workflow),
      # e.g. to publish the current version right after WordPress.org approves the plugin.
      # Started by hand for a version that's already released: refresh its downloads and notes.
      - name: Refresh existing GitHub release
        if: steps.exists.outputs.skip == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## ${{ steps.v.outputs.version }}" 'index($0,v)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > changes.txt
          { cat .github/release-header.md; echo; cat changes.txt; } > notes.txt
          gh release upload "v${{ steps.v.outputs.version }}" dist/*.zip dist/*.sha256 --clobber
          gh release edit "v${{ steps.v.outputs.version }}" --notes-file notes.txt

      - name: Check for WordPress.org credentials
        id: svn
        if: steps.exists.outputs.skip != 'true' || github.event_name == 'workflow_dispatch'
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        run: '[ -n "$SVN_USERNAME" ] && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "No SVN credentials yet: skipping WordPress.org."'

      - name: Unpack the WordPress.org build
        if: steps.svn.outputs.ok == 'true'
        run: mkdir -p build && unzip -q dist/livepull-wordpress-org.zip -d build

      - name: Publish to WordPress.org
        if: steps.svn.outputs.ok == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: livepull
          VERSION: ${{ steps.v.outputs.version }}
          BUILD_DIR: build/livepull
          ASSETS_DIR: .wordpress-org
